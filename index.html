
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Leitor Nota10">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <title>Leitor Mestre | Analisador de Leitura com IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { font-family: 'Inter', sans-serif; background-color: #111111 !important; color: #E5E7EB; }

        /* ===== Dark theme overrides (Tailwind) ===== */
        /* Fundos claros -> fundo escuro principal */
        .bg-slate-50,
        .bg-gray-50,
        .bg-\[\#F8FAFC\],
        .bg-\[\#F5F3FF\] { background-color: #111111 !important; }

        /* Cards brancos -> card escuro */
        .bg-white { background-color: #1A1A1A !important; }

        /* Tons claros secundários */
        .bg-slate-100,
        .bg-gray-100 { background-color: #1F1F1F !important; }
        .bg-slate-200,
        .bg-gray-200 { background-color: #262626 !important; }

        /* Acento violeta suave em dark */
        .bg-violet-50 { background-color: #2A1F3D !important; }
        .bg-violet-100 { background-color: #3B2A57 !important; }

        /* Texto */
        .text-slate-900,
        .text-\[\#1E293B\],
        .text-gray-900,
        .text-black { color: #F1F5F9 !important; }
        .text-slate-800,
        .text-gray-800 { color: #E2E8F0 !important; }
        .text-slate-700,
        .text-gray-700 { color: #CBD5E1 !important; }
        .text-slate-600,
        .text-gray-600 { color: #94A3B8 !important; }
        .text-slate-500,
        .text-gray-500 { color: #94A3B8 !important; }
        .text-slate-400,
        .text-gray-400 { color: #64748B !important; }

        /* Bordas */
        .border-white,
        .border-slate-100,
        .border-slate-200,
        .border-gray-100,
        .border-gray-200 { border-color: #2A2A2A !important; }
        .border-slate-300,
        .border-gray-300 { border-color: #3A3A3A !important; }
        .divide-slate-100 > :not([hidden]) ~ :not([hidden]),
        .divide-slate-200 > :not([hidden]) ~ :not([hidden]) { border-color: #2A2A2A !important; }

        /* Destaque de leitura (palavra atual) */
        .bg-violet-100 { background-color: #3B2A57 !important; }
        .text-violet-900 { color: #EDE9FE !important; }
        .text-violet-700 { color: #C4B5FD !important; }

        /* Sombra em dark fica menos visível; ajusta leve ring */
        .shadow-xl,
        .shadow-2xl,
        .shadow-lg { box-shadow: 0 10px 30px rgba(0,0,0,0.45) !important; }

        /* Placeholder/inputs */
        input, textarea, select { background-color: #1A1A1A; color: #E5E7EB; }
        input::placeholder, textarea::placeholder { color: #64748B; }
    </style>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="text-slate-200" style="background-color:#111111">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
